name: CallRelay
options:
  bundleIdPrefix: dev.zamad.callrelay
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 11.15.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    exactVersion: 8.0.0
  PhoneNumberKit:
    url: https://github.com/marmelroy/PhoneNumberKit.git
    exactVersion: 4.1.8
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 137.0.0

settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    OTHER_LDFLAGS: "$(inherited) -ObjC"

targets:
  CallRelay:
    type: application
    platform: iOS
    sources:
      - path: CallRelay
        excludes:
          - Resources/Info.plist
          - Resources/CallRelay.entitlements
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: PhoneNumberKit
        product: PhoneNumberKit
      - package: WebRTC
        product: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zamad.callrelay.ios
        PRODUCT_NAME: Call Relay
        PRODUCT_MODULE_NAME: CallRelay
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CallRelay/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: CallRelay/Resources/CallRelay.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    postCompileScripts: []

  CallRelayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CallRelayTests
    dependencies:
      - target: CallRelay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zamad.callrelay.ios.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CallRelay:
    build:
      targets:
        CallRelay: all
        CallRelayTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: CallRelayTests
    archive:
      config: Release
